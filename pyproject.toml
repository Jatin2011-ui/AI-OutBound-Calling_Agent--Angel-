[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-outbound-calling-agent"
version = "0.1.0"
description = "Autonomous outbound voice agent orchestrated with LangGraph, Groq (openai/gpt-oss-120b), Deepgram STT/TTS, HuggingFace MiniLM embeddings, Twilio Media Streams and pgvector memory."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "AI Engineering" }]
dependencies = [
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "sqlalchemy[asyncio]>=2.0.29",
    "asyncpg>=0.29",
    "pgvector>=0.3.6",
    "groq>=0.11",
    "sentence-transformers>=3.0",
    "langgraph>=0.2",
    "twilio>=9.0",
    "websockets>=12.0",
    "audioop-lts>=0.2.1; python_version >= '3.13'",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "black>=24.3",
    "isort>=5.13",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: tests that require live external services (DB, Twilio, Groq, Deepgram)",
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "ASYNC", "B"]
ignore = ["E501"]
